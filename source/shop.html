<div class="phead phead--shop">
  <h1 id="shopTitle">All products</h1>
  <p class="lede">Our own stock in Dubai and the United Kingdom — authenticated at our bench,
    priced against the live market. Happy browsing.</p>
</div>

<div class="shopbar" id="fbaranchor">
  <button class="filtoggle" id="filtoggle" aria-expanded="false" aria-controls="frail">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
    <span id="filtoggletext">Filters</span><b id="filcount" hidden></b></button>
  <div class="locseg" id="locseg" role="group" aria-label="Held in">
    <button data-l="" aria-pressed="true">All</button>
    <button data-l="Dubai" aria-pressed="false">UAE</button>
    <button data-l="United Kingdom" aria-pressed="false">UK</button>
  </div>
  <label class="shopsearch">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.4"/><path d="M11 11l3.6 3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <input id="shopq" type="search" autocomplete="off" placeholder="Search the collection" aria-label="Search watches">
    <button class="sqclear" id="sqclear" aria-label="Clear search">×</button>
  </label>
  <div class="count"><b id="cnt">24</b> watches <span id="ofTotal"></span></div>
  <div class="active" id="active"></div>
  <button class="fclear" id="clear" hidden>Clear all</button>
  <div class="sortwrap">
    <label for="sort">Sort</label>
    <select id="sort">
      <option value="new">Newest in</option>
      <option value="plow">Price — low to high</option>
      <option value="phigh">Price — high to low</option>
      <option value="year">Year — newest first</option>
    </select>
  </div>
</div>

<div class="shopwrap">
  <aside class="frail" id="frail" aria-label="Filters"></aside>
  <div class="results">
    <div class="pgrid" id="pgrid"></div>
    <div class="empty" id="empty" style="display:none">
      Nothing matches that combination — try widening the price band or clearing a filter.
    </div>
  </div>
</div>
