<div class="phead phead--rv">
  <div class="crumbs"><a href="index.html">Home</a> &nbsp;/&nbsp; <span id="rvcrumb">Reserve</span></div>
</div>

<div class="rvwrap">
  <div class="rvpiece">
    <div class="rvid" id="rvid"></div>
    <div class="rvshot" id="rvshot"></div>
    <div class="rvspec" id="rvspec"></div>
  </div>

  <aside class="rvpanel" id="rvpanel">
    <form id="rvform" novalidate>
      <div class="rvph1" id="rvh1">Reserve this watch</div>
      <p class="rvsub">Held in your name for 24 hours. No deposit, nothing charged.</p>
      <div class="fgrid">
        <div class="f"><label for="rv-first">First name</label>
          <input id="rv-first" name="first" autocomplete="given-name" required></div>
        <div class="f"><label for="rv-last">Last name</label>
          <input id="rv-last" name="last" autocomplete="family-name" required></div>
        <div class="f full"><label for="rv-phone">Phone number</label>
          <div id="rv-telmount"></div></div>
        <div class="f full"><label for="rv-email">Email</label>
          <input id="rv-email" name="email" type="email" autocomplete="email" required></div>
      </div>
      <div class="berr" id="rv-err" hidden></div>
      <button class="b1 rvgo" id="rv-go" type="submit">
        <span class="lbl">Reserve it</span> <span class="a">→</span></button>
      <div class="rvassure">
        <span><i></i>We confirm on WhatsApp within the hour.</span>
        <span><i></i>No deposit, and nothing to cancel.</span>
        <span><i></i>Authenticated at our own bench.</span>
      </div>
    </form>

    <div class="rvdone" id="rvdone" hidden>
      <div class="btick" aria-hidden="true"><span></span></div>
      <div class="rvph1">It is held in your name.</div>
      <p class="rvsub" id="rvdonelede"></p>
      <a class="b2 rvwide" id="rvwa" href="https://wa.me/971553892824">Message us on WhatsApp <span class="a">→</span></a>
      <p class="rvref" id="rvref"></p>
    </div>
  </aside>
</div>
